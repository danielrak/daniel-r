meta:
  name: Daniel Rakotomalala
  link: https://daniel-r.com

color:
  palette:
    paper: "#FFFFFF"
    ink: "#1F1F1F"
    muted: "#5C5C5C"
    rule: "#D0D3D8"
    band: "#F2F4F7"
    navy: "#1F3D7A"
  foreground: ink
  background: paper
  primary: navy
  secondary: muted
  link: navy

typography:
  fonts:
    - family: Source Serif 4
      source: file
      files:
        - path: assets/fonts/source-serif-4-latin-400-normal.woff2
          weight: 400
          style: normal
        - path: assets/fonts/source-serif-4-latin-400-italic.woff2
          weight: 400
          style: italic
    - family: Source Sans 3
      source: file
      files:
        - path: assets/fonts/source-sans-3-latin-400-normal.woff2
          weight: 400
          style: normal
        - path: assets/fonts/source-sans-3-latin-600-normal.woff2
          weight: 600
          style: normal
        - path: assets/fonts/source-sans-3-latin-700-normal.woff2
          weight: 700
          style: normal
  base:
    family: Source Serif 4
    size: 17px
    line-height: 1.6
  headings:
    family: Source Sans 3
    weight: 700
    line-height: 1.2
  link:
    decoration: underline
