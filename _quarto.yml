format:
  html:
    theme: [brand, styles/custom.scss]
    lang: en-GB
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    link-external-icon: false
    include-in-header: includes/head.html
    html-math-method: plain
    code-copy: false
    citations-hover: false
    footnotes-hover: false
    smooth-scroll: false
    grid:
      body-width: 760px
      sidebar-width: 200px
      margin-width: 200px
      gutter-width: 1.5rem

execute:
  freeze: auto
