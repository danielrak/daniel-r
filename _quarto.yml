project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "*/index.qmd"
    - "projects/*/index.qmd"
  post-render: tools/post_render.py
  resources:
    - _redirects
    - _headers
    - robots.txt
    - "cv/*.pdf"
    - "assets/fonts/*"
    - assets/contact.js

website:
  title: "Daniel Rakotomalala"
  site-url: https://daniel-r.com
  description: "Daniel Rakotomalala is a data scientist and project lead at DEPP, the statistical directorate of the French Ministry of Education. PhD in economics; author of the R packages scrutr, genproc and cryptRopen."
  favicon: assets/favicon.svg
  image: assets/og-image.png
  image-alt: "Daniel Rakotomalala, data scientist and project lead, DEPP"
  open-graph:
    locale: en_GB
  twitter-card:
    card-style: summary_large_image
  search: false
  page-navigation: false
  reader-mode: false
  navbar:
    pinned: false
    collapse-below: md
    left:
      - text: Home
        href: index.qmd
