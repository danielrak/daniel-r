<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Daniel Rakotomalala, data scientist and project lead, DEPP">
  <style>
    @font-face { font-family: "Source Sans 3"; src: url("fonts/source-sans-3-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
    @font-face { font-family: "Source Sans 3"; src: url("fonts/source-sans-3-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
    @font-face { font-family: "Source Serif 4"; src: url("fonts/source-serif-4-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
    .name { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-weight: 700; font-size: 84px; fill: #1F1F1F; }
    .role { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-weight: 400; font-size: 40px; fill: #5C5C5C; }
    .line { font-family: "Source Serif 4", Georgia, serif; font-size: 34px; fill: #1F1F1F; }
